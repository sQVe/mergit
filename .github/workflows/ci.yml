name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run --bun format:check
      - run: bun run --bun style:check
      - run: bun run --bun typecheck
      - run: bun run --bun knip

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run --bun test

  mutation:
    name: Mutation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Stryker reuses a result while the mutated code and the tests that covered it are unchanged.
      # It does not see helpers, dependencies, or config, so their hash is part of the key. A change
      # to unmutated production code can still leave a stale result.
      - id: restore-incremental
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tau/stryker-incremental.json
          key: mutation-incremental-${{ github.event.pull_request.number }}-${{ hashFiles('src/**/*.test.ts', 'src/**/*.test.tsx', 'tests/*.test.tsx', 'src/**/*Harness.ts', 'src/**/*Harness.tsx', 'bun.lock', 'package.json', 'tsconfig.json', 'stryker.config.json') }}-${{ github.sha }}
          restore-keys: |
            mutation-incremental-${{ github.event.pull_request.number }}-${{ hashFiles('src/**/*.test.ts', 'src/**/*.test.tsx', 'tests/*.test.tsx', 'src/**/*Harness.ts', 'src/**/*Harness.tsx', 'bun.lock', 'package.json', 'tsconfig.json', 'stryker.config.json') }}-
      - name: Run mutation testing on changed lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          jq '.concurrency = "100%"' stryker.config.json > "${RUNNER_TEMP}/stryker.config.json"
          mapfile -t command < <(jq --raw-output '.mutation.argv[]' .pi/tau.json)
          "${command[@]}" --config "${RUNNER_TEMP}/stryker.config.json" changed "$BASE_SHA"
      # Surviving mutants fail the step above, and their results are still worth reusing.
      - if: ${{ !cancelled() && hashFiles('.tau/stryker-incremental.json') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tau/stryker-incremental.json
          key: ${{ steps.restore-incremental.outputs.cache-primary-key }}
